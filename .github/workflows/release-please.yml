name: release-please
on:
  push:
    branches:
      - main

permissions:
  issues: write
  contents: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Debug: Show what outputs we got
      - name: Debug Release Please outputs
        run: |
          echo "Release created: ${{ steps.release.outputs.release_created }}"
          echo "Tag name: ${{ steps.release.outputs.tag_name }}"
          echo "Upload URL: ${{ steps.release.outputs.upload_url }}"

  build-executables:
    name: Build Executables
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        target: [windows-x64, linux-x64, macos-x64]
    uses: ./.github/workflows/build-executables.yml
    with:
      target: ${{ matrix.target }}
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      actions: read
      id-token: write