name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'dwellpy-v*'  # Also trigger on tag pushes (more reliable)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
      test_mode:
        description: 'Test mode (skip actual publishing)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade build twine
    
    - name: Build package  
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi' && github.event.inputs.test_mode != 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi' && github.event.inputs.test_mode == false)
    
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dwellpy
    
    permissions:
      id-token: write
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
        verbose: true
        print-hash: true

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Auto-publish on releases OR tag pushes, manual publish on workflow_dispatch
    if: |
      github.event_name == 'release' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi' && github.event.inputs.test_mode != 'true')
    
    environment:
      name: pypi
      url: https://pypi.org/p/dwellpy
    
    permissions:
      id-token: write
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    
    - name: Test mode check
      if: github.event.inputs.test_mode == 'true'
      run: |
        echo "🧪 TEST MODE: Would publish to PyPI but skipping due to test mode"
        echo "Package contents:"
        ls -la dist/
        echo "This would be published to PyPI in production"
        exit 0
    
    - name: Publish to PyPI
      if: github.event.inputs.test_mode != 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
        print-hash: true