name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libxcb-xkb1 \
          libxcb-cursor0 \
          libxcb-shape0 \
          libxcb-sync1 \
          libxcb-xtest0 \
          libgl1-mesa-glx \
          libegl1-mesa \
          libxss1 \
          libgconf-2-4 \
          libxcomposite1 \
          libxdamage1 \
          libxtst6 \
          libxrandr2 \
          libasound2 \
          libpangocairo-1.0-0 \
          libatk1.0-0 \
          libcairo-gobject2 \
          libgtk-3-0 \
          libgdk-pixbuf2.0-0
    
    - name: Start virtual display
      run: |
        sudo Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        sleep 3
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r dwellpy/requirements.txt
        pip install pytest flake8
    
    - name: Install package in development mode
      run: |
        pip install -e .
    
    - name: Lint with flake8
      run: |
        flake8 dwellpy/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 dwellpy/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Test package structure
      run: |
        echo "Testing package can be imported..."
        python -c "
# Test basic package structure without Qt
import sys
import os

# Test core non-Qt modules
try:
    from dwellpy.core.dwell_algorithm import DwellDetector
    print('✓ DwellDetector import successful')
except Exception as e:
    print(f'✗ DwellDetector import failed: {e}')
    sys.exit(1)

try:
    from dwellpy.core.click_manager import ClickManager  
    print('✓ ClickManager import successful')
except Exception as e:
    print(f'✗ ClickManager import failed: {e}')
    sys.exit(1)

try:
    from dwellpy.config.constants import Colors
    print('✓ Config constants import successful')
except Exception as e:
    print(f'✗ Config constants import failed: {e}')
    sys.exit(1)

try:
    import dwellpy
    print('✓ Main package import successful')
    print(f'✓ Package version: {dwellpy.__version__}')
except Exception as e:
    print(f'✗ Main package import failed: {e}')
    sys.exit(1)

print('All essential imports successful - package is ready for PyPI!')
"

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check build artifacts
      run: |
        twine check dist/*
        ls -la dist/
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi'
    
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dwellpy
    
    permissions:
      id-token: write
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi')
    
    environment:
      name: pypi
      url: https://pypi.org/p/dwellpy
    
    permissions:
      id-token: write
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
