name: Build Executable

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      target:
        required: false
        type: string
        default: "all"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for testing'
        required: true
        type: string
        default: 'v0.9.0'
      target:
        description: 'Target platform'
        required: false
        type: choice
        default: "all"
        options:
          - all
          - windows-x64
          - linux-debian-x64
          - linux-debian-arm64
          - macos-x64

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - target: windows-x64
            runner: windows-latest
            python-version: '3.11'
            shell: pwsh
            arch: x64
            
          # Debian builds (covers Ubuntu compatibility)
          - target: linux-debian-x64
            runner: ubuntu-22.04
            python-version: '3.11'
            shell: bash
            arch: x64
            distro: debian
            
          - target: linux-debian-arm64
            runner: ubuntu-22.04
            python-version: '3.11'
            shell: bash
            arch: arm64
            distro: debian
            
          # macOS build
          - target: macos-x64
            runner: macos-13
            python-version: '3.11'
            shell: bash
            arch: x64
    
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    
    steps:
      - name: Check if target should run
        id: should-run
        run: |
          if ("${{ inputs.target }}" -eq "all" -or "${{ inputs.target }}" -eq "${{ matrix.target }}") {
            echo "should_run=true" >> $env:GITHUB_OUTPUT
            Write-Host "Building for ${{ matrix.target }}"
          } else {
            echo "should_run=false" >> $env:GITHUB_OUTPUT
            Write-Host "Skipping ${{ matrix.target }}"
          }
        if: startsWith(matrix.target, 'windows-')

      - name: Check if target should run (Unix)
        id: should-run-unix
        shell: bash
        run: |
          if [[ "${{ inputs.target }}" == "all" || "${{ inputs.target }}" == "${{ matrix.target }}" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Building for ${{ matrix.target }}"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.target }}"
          fi
        if: matrix.target != 'windows-x64' && matrix.target != 'windows-arm64'

      - name: Set should run output
        id: final-check
        run: |
          if ("${{ steps.should-run.outputs.should_run }}" -eq "true" -or "${{ steps.should-run-unix.outputs.should_run }}" -eq "true") {
            echo "should_run=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "should_run=false" >> $env:GITHUB_OUTPUT
          }
        if: startsWith(matrix.target, 'windows-')

      - name: Set should run output (Unix)
        id: final-check-unix
        shell: bash
        run: |
          if [[ "${{ steps.should-run-unix.outputs.should_run }}" == "true" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
        if: matrix.target != 'windows-x64' && matrix.target != 'windows-arm64'

      - name: Checkout repository
        if: steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM emulation
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && matrix.arch == 'arm64' && matrix.distro == 'debian'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Install system dependencies (Debian)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && matrix.distro == 'debian'
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip python3-venv python3-dev build-essential
          
          # Create symlink for easier usage
          if [ ! -f /usr/bin/python ]; then
            sudo ln -sf /usr/bin/python3 /usr/bin/python || true
          fi

      - name: Set up virtual display (Linux only)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get install -y xvfb
          echo "DISPLAY=:99" >> $GITHUB_ENV
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 3

      - name: Set up Python (Windows/macOS)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && (startsWith(matrix.target, 'windows-') || startsWith(matrix.target, 'macos-'))
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}

      - name: Set up Python (Debian native)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && matrix.distro == 'debian'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies (Windows)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && startsWith(matrix.target, 'windows-')
        working-directory: dwellpy
        run: |
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
            python -m pip install pyinstaller
          } else {
            Write-Host "Warning: requirements.txt not found in dwellpy/"
            python -m pip install PyQt6 PyQt6-Qt6 PyQt6-sip pynput pyinstaller
          }

      - name: Install NSIS (Windows)
        if: startsWith(matrix.target, 'windows-')
        run: |
          Write-Host "Installing NSIS..."
          choco install nsis -y
          Write-Host "NSIS installed successfully"

      - name: Install project dependencies (Unix)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && (startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'macos-'))
        working-directory: dwellpy
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
            python -m pip install pyinstaller
          else
            echo "Warning: requirements.txt not found in dwellpy/"
            python -m pip install PyQt6 PyQt6-Qt6 PyQt6-sip pynput pyinstaller
          fi

      - name: Install additional Qt dependencies (Linux)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get install -y \
            libegl1-mesa \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libfontconfig1 \
            libfreetype6 \
            libdbus-1-3

      - name: Verify installation
        if: steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true'
        shell: bash
        run: |
          echo "=== Python and PyQt6 Installation Check ==="
          python --version
          python -c "import sys; print('Python executable:', sys.executable)"
          python -c "import PyQt6.QtCore; print('PyQt6.QtCore version:', PyQt6.QtCore.PYQT_VERSION_STR)" || echo "PyQt6.QtCore import failed"
          python -c "import PyQt6.QtWidgets; print('PyQt6.QtWidgets imported successfully')" || echo "PyQt6.QtWidgets import failed"
          python -c "import pynput; print('pynput imported successfully')" || echo "pynput import failed"
          
          echo "=== PyInstaller Installation Check ==="
          python -c "import PyInstaller; print('PyInstaller version:', PyInstaller.__version__)" || echo "PyInstaller import failed"
          which pyinstaller || echo "pyinstaller command not found"
          python -m PyInstaller --version || echo "PyInstaller module execution failed"

      - name: Build executable with PyInstaller (Windows)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && startsWith(matrix.target, 'windows-')
        run: |
          if (Test-Path "utils/build_executable.py") {
            Write-Host "Using existing build script..."
            python utils/build_executable.py
          } else {
            Write-Host "Creating PyInstaller command..."
            python -m PyInstaller --onefile --windowed --name "Dwellpy" --add-data "dwellpy;dwellpy" dwellpy/__main__.py
          }

      - name: Build executable with PyInstaller (Unix)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && (startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'macos-'))
        shell: bash
        run: |
          if [ -f "utils/build_executable.py" ]; then
            echo "Using existing build script..."
            python utils/build_executable.py
          else
            echo "Creating PyInstaller command..."
            python -m PyInstaller --onefile --windowed --name "Dwellpy" --add-data "dwellpy:dwellpy" dwellpy/__main__.py
          fi

      - name: Verify build output (Windows)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && startsWith(matrix.target, 'windows-')
        run: |
          Get-ChildItem -Path "dist" -ErrorAction SilentlyContinue | Format-Table
          Get-ChildItem -Path "." -Recurse -Name "*wellpy*" -ErrorAction SilentlyContinue

      - name: Verify build output (Unix)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && (startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'macos-'))
        shell: bash
        run: |
          echo "Contents of dist directory:"
          ls -la dist/ || echo "dist/ directory not found"
          
          echo "Looking for executables..."
          find . -name "*wellpy*" -type f 2>/dev/null || echo "No Dwellpy files found"

      - name: Get version from tag (Windows)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && startsWith(matrix.target, 'windows-')
        id: get-version
        run: |
          $version = "${{ inputs.tag_name }}" -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Extracted version: $version"

      - name: Get version from tag (Unix)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && (startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'macos-'))
        id: get-version-unix
        shell: bash
        run: |
          version="${{ inputs.tag_name }}"
          version=${version#v}
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Extracted version: $version"

      - name: Prepare release artifact (Windows)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && startsWith(matrix.target, 'windows-')
        run: |
          Set-Location dist
          
          # For Windows, we expect the build script to create the installer
          # Look for the installer file created by the Windows post-build process
          $installerFiles = Get-ChildItem -Name "*installer*.exe"
          if ($installerFiles) {
            foreach ($file in $installerFiles) {
              Write-Host "Found installer: $file"
              echo "ARTIFACT_NAME=$file" >> $env:GITHUB_ENV
              break
            }
          } else {
            Write-Host "Warning: No installer found in dist directory"
            # List all files to help debug
            Write-Host "Available files:"
            Get-ChildItem | Format-Table
          }
          
          Write-Host "Final dist contents:"
          Get-ChildItem | Format-Table

      - name: Prepare release artifact (Unix)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && (startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'macos-'))
        shell: bash
        run: |
          cd dist
          
          version="${{ steps.get-version-unix.outputs.version }}"          # Handle macOS DMG only - enforce DMG-only uploads for macOS
          if [[ "${{ matrix.target }}" == "macos-x64" ]]; then
            # Check for DMG (required for macOS distribution)
            if [ -f "dwellpy-installer.dmg" ]; then
              dmg_name="dwellpy-installer-$version-${{ matrix.target }}.dmg"
              echo "Renaming dwellpy-installer.dmg to $dmg_name"
              mv "dwellpy-installer.dmg" "$dmg_name"
              echo "ARTIFACT_NAME=$dmg_name" >> $GITHUB_ENV
              echo "Successfully prepared DMG: $dmg_name"
            else
              echo "ERROR: DMG not found! macOS builds must create DMG installers."
              echo "The build script should automatically create DMG from app bundle."
              echo "Available files in dist:"
              ls -la
              echo ""
              echo "Checking if app bundle exists for DMG creation:"
              if [ -d "Dwellpy.app" ]; then
                echo "App bundle found - trying to create DMG manually..."
                cd ..
                if [ -f "utils/create_macos_dmg.py" ]; then
                  python utils/create_macos_dmg.py
                  cd dist
                  if [ -f "dwellpy-installer.dmg" ]; then
                    dmg_name="dwellpy-installer-$version-${{ matrix.target }}.dmg"
                    echo "DMG created successfully, renaming to $dmg_name"
                    mv "dwellpy-installer.dmg" "$dmg_name"
                    echo "ARTIFACT_NAME=$dmg_name" >> $GITHUB_ENV
                  else
                    echo "DMG creation failed"
                    exit 1
                  fi
                else
                  echo "DMG creation script not found"
                  exit 1
                fi
              else
                echo "No app bundle found either - build may have failed"
                exit 1
              fi
            fi
          else
            # Linux: Handle executable
            for file in *; do
              if [ -f "$file" ] && [ -x "$file" ] && [[ "$file" != *.* ]]; then
                new_name="dwellpy-$version-${{ matrix.target }}"
                
                echo "Renaming $file to $new_name"
                mv "$file" "$new_name"
                chmod +x "$new_name"
                  echo "ARTIFACT_NAME=$new_name" >> $GITHUB_ENV
                break
              fi
            done
          fi
            echo "Final dist contents:"
          ls -la

      - name: Upload to release
        if: steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: dist/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create build summary (Windows)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && startsWith(matrix.target, 'windows-')
        run: |
          echo "## Build Summary for ${{ matrix.target }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get-version.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ matrix.target }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Architecture**: ${{ matrix.arch }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Python**: ${{ matrix.python-version }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Runner**: ${{ matrix.runner }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Artifact**: $env:ARTIFACT_NAME" >> $env:GITHUB_STEP_SUMMARY

      - name: Create build summary (Unix)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && (startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'macos-'))
        shell: bash
        run: |
          echo "## Build Summary for ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get-version-unix.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture**: ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Distro**: ${{ matrix.distro || 'macOS' }}" >> $GITHUB_STEP_SUMMARY          echo "- **Python**: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: ${{ matrix.runner }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: ${ARTIFACT_NAME:-'Not found'}" >> $GITHUB_STEP_SUMMARY

      - name: Clean up (Windows)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && startsWith(matrix.target, 'windows-')
        run: |
          Remove-Item -Path "dist\*.*" -Recurse -Force
          Remove-Item -Path "build\*.*" -Recurse -Force
          Remove-Item -Path "dwellpy\__pycache__\*.*" -Recurse -Force
          Remove-Item -Path "dwellpy\*.spec" -Force

      - name: Clean up (Unix)
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && (startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'macos-'))
        shell: bash
        run: |
          rm -rf dist/* || true
          rm -rf build/* || true
          rm -rf dwellpy/__pycache__/* || true
          rm -f dwellpy/*.spec || true

      - name: Set up macOS DMG creation tools
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          echo "Checking macOS DMG creation tools..."
          which hdiutil || echo "hdiutil not found"
          which iconutil || echo "iconutil not found"
          
          # Ensure Xcode Command Line Tools are available
          xcode-select --print-path || echo "Xcode Command Line Tools may not be installed"
          
          echo "macOS version:"
          sw_vers

      - name: Debug macOS build output
        if: (steps.final-check.outputs.should_run == 'true' || steps.final-check-unix.outputs.should_run == 'true') && startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          echo "=== macOS Build Debug ==="
          echo "Contents of dist directory:"
          ls -la dist/ || echo "dist/ directory not found"
          
          echo "Looking for app bundle:"
          find . -name "*.app" -type d 2>/dev/null || echo "No .app bundles found"
          
          echo "Looking for DMG files:"
          find . -name "*.dmg" -type f 2>/dev/null || echo "No .dmg files found"
          
          echo "Checking if DMG creation script exists:"
          ls -la utils/create_macos_dmg.py || echo "DMG creation script not found"
          
          echo "Looking for any Dwellpy files:"
          find . -name "*wellpy*" -type f 2>/dev/null || echo "No Dwellpy files found"
