name: Build Executable

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      target:
        required: false
        type: string
        default: "all"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for testing'
        required: true
        type: string
        default: 'v0.8.0'
      target:
        description: 'Target platform'
        required: false
        type: choice
        default: "all"
        options:
          - all
          - windows-x64
          - linux-x64
          - macos-x64

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            python-version: '3.11'
          - target: linux-x64
            runner: ubuntu-22.04
            python-version: '3.11'
          - target: macos-x64
            runner: macos-13
            python-version: '3.11'
    
    runs-on: ${{ matrix.runner }}
    
    steps:
      - name: Check if target should run
        id: should-run
        shell: bash
        run: |
          if [[ "${{ inputs.target }}" == "all" || "${{ inputs.target }}" == "${{ matrix.target }}" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Building for ${{ matrix.target }}"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.target }}"
          fi

      - name: Checkout repository
        if: steps.should-run.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up virtual display (Linux only)
        if: steps.should-run.outputs.should_run == 'true' && matrix.target == 'linux-x64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          echo "DISPLAY=:99" >> $GITHUB_ENV
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 3

      - name: Set up Python
        if: steps.should-run.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create build environment
        if: steps.should-run.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller

      - name: Install project dependencies
        if: steps.should-run.outputs.should_run == 'true'
        working-directory: dwellpy
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "Warning: requirements.txt not found in dwellpy/"
            python -m pip install PyQt6 pynput
          fi

      - name: Verify installation
        if: steps.should-run.outputs.should_run == 'true'
        run: |
          python -c "import PyQt6; print('PyQt6 version:', PyQt6.QtCore.PYQT_VERSION_STR)"
          python -c "import pynput; print('pynput imported successfully')"

      - name: Build executable with PyInstaller
        if: steps.should-run.outputs.should_run == 'true'
        run: |
          # Create simple PyInstaller spec if build script doesn't exist
          if [ ! -f "utils/build_executable.py" ]; then
            echo "Creating PyInstaller command..."
            pyinstaller --onefile \
              --windowed \
              --name "Dwellpy" \
              --add-data "dwellpy:dwellpy" \
              dwellpy/__main__.py
          else
            echo "Using existing build script..."
            python utils/build_executable.py
          fi

      - name: Verify build output
        if: steps.should-run.outputs.should_run == 'true'
        run: |
          echo "Contents of dist directory:"
          ls -la dist/ || echo "dist/ directory not found"
          
          echo "Looking for executables..."
          find . -name "*wellpy*" -type f 2>/dev/null || echo "No Dwellpy files found"

      - name: Get version from tag
        if: steps.should-run.outputs.should_run == 'true'
        id: get-version
        shell: bash
        run: |
          version="${{ inputs.tag_name }}"
          version=${version#v}
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Extracted version: $version"

      - name: Prepare release artifact
        if: steps.should-run.outputs.should_run == 'true'
        shell: bash
        run: |
          cd dist
          
          # Find the executable
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            exe_pattern="*.exe"
          else
            exe_pattern="*"
          fi
          
          # Rename executable
          for file in $exe_pattern; do
            if [ -f "$file" ] && [[ "$file" == *"wellpy"* ]]; then
              new_name="dwellpy-${{ steps.get-version.outputs.version }}-${{ matrix.target }}"
              if [ "${{ matrix.target }}" = "windows-x64" ]; then
                new_name="${new_name}.exe"
              fi
              
              echo "Renaming $file to $new_name"
              mv "$file" "$new_name"
              
              # Make executable on Unix systems
              if [ "${{ matrix.target }}" != "windows-x64" ]; then
                chmod +x "$new_name"
              fi
              
              echo "ARTIFACT_NAME=$new_name" >> $GITHUB_ENV
              break
            fi
          done
          
          echo "Final dist contents:"
          ls -la

      - name: Upload to release
        if: steps.should-run.outputs.should_run == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: dist/dwellpy-${{ steps.get-version.outputs.version }}-${{ matrix.target }}*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create build summary
        if: steps.should-run.outputs.should_run == 'true'
        run: |
          echo "## Build Summary for ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Python**: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: ${{ matrix.runner }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: ${ARTIFACT_NAME:-'Not found'}" >> $GITHUB_STEP_SUMMARY
