name: Build Executable

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      upload_url:
        required: true
        type: string
      target:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for testing'
        required: true
        type: string
        default: 'v0.8.0'
      upload_url:
        description: 'Upload URL (leave empty for testing)'
        required: false
        type: string
        default: ''
      target:
        description: 'Target platform'
        required: true
        type: choice
        options:
          - windows-x64
          - linux-x64
          - macos-x64

jobs:
  build:
    name: Build Executable
    strategy:
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-13
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    
    steps:
      - name: Check if target should run
        id: should-run
        shell: bash
        run: |
          if [[ "${{ inputs.target }}" == "" || "${{ inputs.target }}" == "${{ matrix.target }}" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout repository
        if: steps.should-run.outputs.should_run == 'true'
        uses: actions/checkout@v4
      
      - name: Set up virtual display (Linux only)
        if: steps.should-run.outputs.should_run == 'true' && startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Set up Python
        if: steps.should-run.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.should-run.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r dwellpy/requirements.txt
          pip install pyinstaller

      - name: Build executable
        if: steps.should-run.outputs.should_run == 'true'
        run: |
          python utils/build_executable.py

      - name: Get version from tag
        if: steps.should-run.outputs.should_run == 'true'
        id: get-version
        shell: bash
        run: |
          version="${{ inputs.tag_name }}"
          # Remove 'v' prefix if present
          version=${version#v}
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"

      - name: Rename executable with version and target
        if: steps.should-run.outputs.should_run == 'true'
        shell: bash
        run: |
          if compgen -G "dist/Dwellpy*" > /dev/null; then
            for f in dist/Dwellpy*; do
              ext="${f##*.}"
              base="dwellpy_v${{ steps.get-version.outputs.version }}_${{ matrix.target }}"
              if [[ "$f" == *.exe ]]; then
                mv "$f" "dist/${base}.exe"
                echo "Renamed $f to dist/${base}.exe"
              else
                mv "$f" "dist/${base}"
                echo "Renamed $f to dist/${base}"
              fi
            done
            ls -la dist/
          else            echo "Error: No Dwellpy executable found in dist/"
            ls -la dist/
            exit 1
          fi

      - name: Upload executable to release (Windows)
        if: steps.should-run.outputs.should_run == 'true' && inputs.upload_url != '' && (matrix.target == 'windows-x64' || matrix.target == 'windows-arm64')
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ./dist/dwellpy_v${{ steps.get-version.outputs.version }}_${{ matrix.target }}.exe
          asset_name: dwellpy-${{ steps.get-version.outputs.version }}-${{ matrix.target }}.exe
          asset_content_type: application/octet-stream

      - name: Upload executable to release (Non-Windows)
        if: steps.should-run.outputs.should_run == 'true' && inputs.upload_url != '' && matrix.target != 'windows-x64' && matrix.target != 'windows-arm64'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ./dist/dwellpy_v${{ steps.get-version.outputs.version }}_${{ matrix.target }}
          asset_name: dwellpy-${{ steps.get-version.outputs.version }}-${{ matrix.target }}
          asset_content_type: application/octet-stream

      - name: Upload build info
        if: steps.should-run.outputs.should_run == 'true' && inputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ./BUILD_INFO.md
          asset_name: BUILD_INFO.md
          asset_content_type: text/markdown

      - name: List built files (testing)
        if: steps.should-run.outputs.should_run == 'true'
        run: |
          echo "Built files:"
          ls -la dist/
          echo "Built files:"
          ls dist/