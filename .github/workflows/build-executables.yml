name: Build Executable

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      upload_url:
        required: true
        type: string
      target:
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  build:
    name: Build Executable
    strategy:
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-13
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dwellpy/requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          python build_executable.py

      - name: Get version from tag
        id: get-version
        shell: bash
        run: |
          version="${{ inputs.tag_name }}"
          # Remove 'v' prefix if present
          version=${version#v}
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"

      - name: Rename executable with version and target
        shell: bash
        run: |
          if compgen -G "dist/Dwellpy*" > /dev/null; then
            for f in dist/Dwellpy*; do
              ext="${f##*.}"
              base="dwellpy-${{ steps.get-version.outputs.version }}-${{ inputs.target }}"
              if [[ "$f" == *.exe ]]; then
                mv "$f" "dist/${base}.exe"
                echo "Renamed $f to dist/${base}.exe"
              else
                mv "$f" "dist/${base}"
                echo "Renamed $f to dist/${base}"
              fi
            done
            ls -la dist/
          else
            echo "Error: No Dwellpy executable found in dist/"
            ls -la dist/
            exit 1
          fi

      - name: Upload executable to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ (inputs.target == 'windows-x64' || inputs.target == 'windows-arm64') && format('./dist/dwellpy-{0}-{1}.exe', steps.get-version.outputs.version, inputs.target) || format('./dist/dwellpy-{0}-{1}', steps.get-version.outputs.version, inputs.target) }}
          asset_name: ${{ (inputs.target == 'windows-x64' || inputs.target == 'windows-arm64') && format('dwellpy-{0}-{1}.exe', steps.get-version.outputs.version, inputs.target) || format('dwellpy-{0}-{1}', steps.get-version.outputs.version, inputs.target) }}
          asset_content_type: application/octet-stream

      - name: Upload build info
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ./BUILD_INFO.md
          asset_name: BUILD_INFO.md
          asset_content_type: text/markdown
