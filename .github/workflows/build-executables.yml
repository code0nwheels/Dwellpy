name: Build Executable

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      upload_url:
        required: true
        type: string
      target:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for testing'
        required: true
        type: string
        default: 'v0.8.0'
      upload_url:
        description: 'Upload URL (leave empty for testing)'
        required: false
        type: string
        default: ''
      target:
        description: 'Target platform'
        required: true
        type: choice
        options:
          - windows-x64
          - linux-x64
          - macos-x64

jobs:
  build:
    name: Build Executable
    strategy:
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: windows-arm64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-latest
          - target: macos-x64
            runner: macos-13
          - target: macos-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    
    steps:
      - name: Check if target should run
        id: should-run
        shell: bash
        run: |
          if [[ "${{ inputs.target }}" == "" || "${{ inputs.target }}" == "${{ matrix.target }}" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout repository
        if: steps.should-run.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.should-run.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.should-run.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 pynput pyinstaller

      - name: Build executable
        if: steps.should-run.outputs.should_run == 'true'
        run: |
          python utils/build_executable.py

      - name: Get version from tag
        id: get-version
        shell: bash
        run: |
          version="${{ inputs.tag_name }}"
          # Remove 'v' prefix if present
          version=${version#v}
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"

      - name: Rename executable with version and target
        if: steps.should-run.outputs.should_run == 'true'
        shell: bash
        run: |
          if compgen -G "dist/Dwellpy*" > /dev/null; then
            for f in dist/Dwellpy*; do
              ext="${f##*.}"
              base="dwellpy-${{ steps.get-version.outputs.version }}-${{ inputs.target }}"
              if [[ "$f" == *.exe ]]; then
                mv "$f" "dist/${base}.exe"
                echo "Renamed $f to dist/${base}.exe"
              else
                mv "$f" "dist/${base}"
                echo "Renamed $f to dist/${base}"
              fi
            done
            ls -la dist/
          else
            echo "Error: No Dwellpy executable found in dist/"
            ls -la dist/
            exit 1
          fi

      - name: Upload executable to release
        if: ${{ inputs.upload_url != '' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ (inputs.target == 'windows-x64' || inputs.target == 'windows-arm64') && format('./dist/dwellpy-{0}-{1}.exe', steps.get-version.outputs.version, inputs.target) || format('./dist/dwellpy-{0}-{1}', steps.get-version.outputs.version, inputs.target) }}
          asset_name: ${{ (inputs.target == 'windows-x64' || inputs.target == 'windows-arm64') && format('dwellpy-{0}-{1}.exe', steps.get-version.outputs.version, inputs.target) || format('dwellpy-{0}-{1}', steps.get-version.outputs.version, inputs.target) }}
          asset_content_type: application/octet-stream

      - name: Upload build info
        if: ${{ inputs.upload_url != '' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ./BUILD_INFO.md
          asset_name: BUILD_INFO.md
          asset_content_type: text/markdown

      - name: List built files (testing)
        if: steps.should-run.outputs.should_run == 'true'
        run: |
          echo "Built files:"
          ls dist/